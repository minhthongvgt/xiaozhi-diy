<section class="tab-panel" id="panel-peripherals">
  
  
  <div class="config-group">
    <div class="group-header">
      <div class="group-title">

        </div>

        <div class="form-row">

            <div style="flex:1;">
              <label class="toggle-container">

  <script>
    function updateHiddenExtrasPair(btn) {
      const list = btn.closest('.dynamic-list');
      const rows = Array.from(list.querySelectorAll('.dynamic-pair-row'));
      const hidden = list.querySelector('input[type="hidden"]');
      if(hidden) {
          hidden.value = rows.map(r => {
             const inputs = r.querySelectorAll('input');
             if (inputs.length >= 2 && inputs[0].value !== '' && inputs[1].value !== '') {
                 let val = inputs[0].value + ':' + inputs[1].value;
                 if (inputs.length >= 3 && inputs[2].value !== '') {
                     val += '|' + inputs[2].value;
                 }
                 return val;
             }
             return null;
          }).filter(v => v !== null).join(',');
          hidden.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }
    function addDynamicItemPair(btn, ph1, ph2) {
      const listItems = btn.previousElementSibling;
      const div = document.createElement('div');
      div.className = 'dynamic-pair-row';
      div.style = "display:flex; gap:5px; margin-bottom:5px;";
      div.innerHTML = '<input type="number" class="dynamic-input form-control" placeholder="' + ph1 + '" style="flex:1;" oninput="updateHiddenExtrasPair(this)">' +
                      '<input type="number" class="dynamic-input form-control" placeholder="' + ph2 + '" style="flex:1;" oninput="updateHiddenExtrasPair(this)">' +
                      '<input type="text" class="dynamic-input form-control" placeholder="Nhãn (Tùy chọn)" style="flex:2;" oninput="updateHiddenExtrasPair(this)">' +
                      '<button type="button" class="btn btn-sm" style="background:#ff4d4f; color:white; border:none; padding:0 8px; border-radius:4px; cursor:pointer;" onclick="var p=this.parentElement; p.parentElement.removeChild(p); updateHiddenExtrasPair(p.previousElementSibling || btn)">X</button>';
      listItems.appendChild(div);
    }
    function updateHiddenExtras(btn) {
      const list = btn.closest('.dynamic-list');
      const rows = Array.from(list.querySelectorAll('.list-items > div'));
      const hidden = list.querySelector('input[type="hidden"]');
      if(hidden) {
          hidden.value = rows.map(r => {
             const inputs = r.querySelectorAll('input');
             if (inputs.length >= 1 && inputs[0].value !== '') {
                 let val = inputs[0].value;
                 if (inputs.length >= 2 && inputs[1].value !== '') {
                     val += '|' + inputs[1].value;
                 }
                 return val;
             }
             return null;
          }).filter(v => v !== null).join(',');
          hidden.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }
    function addDynamicItem(btn, placeholder) {
      const listItems = btn.previousElementSibling;
      const div = document.createElement('div');
      div.style = "display:flex; gap:5px; margin-bottom:5px;";
      div.innerHTML = '<input type="number" class="dynamic-input form-control" placeholder="' + placeholder + '" style="flex:1;" oninput="updateHiddenExtras(this)">' +
                      '<input type="text" class="dynamic-input form-control" placeholder="Nhãn (Tùy chọn)" style="flex:2;" oninput="updateHiddenExtras(this)">' +
                      '<button type="button" class="btn btn-sm" style="background:#ff4d4f; color:white; border:none; padding:0 8px; border-radius:4px; cursor:pointer;" onclick="var p=this.parentElement; p.parentElement.removeChild(p); updateHiddenExtras(p.previousElementSibling || btn)">X</button>';
      listItems.appendChild(div);
    }
  </script>

  <script>
    // ?n hi?n form n?ng cao
    document.getElementById('dc_motor_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_motor_config').style.display = e.target.checked ? 'block' : 'none';
    });

    document.getElementById('dht_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_dht').style.display = e.target.checked ? 'block' : 'none';
    });
    document.getElementById('temp_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_temp').style.display = e.target.checked ? 'flex' : 'none';
    });
    document.getElementById('gas_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_gas').style.display = e.target.checked ? 'flex' : 'none';
    });
    document.getElementById('bh1750_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_bh1750').style.display = e.target.checked ? 'flex' : 'none';
    });
    document.getElementById('bmp280_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_bmp280').style.display = e.target.checked ? 'flex' : 'none';
    });
    document.getElementById('ldr_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_ldr').style.display = e.target.checked ? 'block' : 'none';
    });

    setTimeout(() => {
      document.getElementById('dc_motor_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('dht_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('temp_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('gas_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('bh1750_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('bmp280_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('ldr_enable')?.dispatchEvent(new Event('change'));
    }, 100);
  </script>
</section>
