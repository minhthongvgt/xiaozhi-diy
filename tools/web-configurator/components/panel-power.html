<section class="tab-panel" id="panel-power">
  
  <div class="config-group">
    <div class="group-header">
      <div class="group-header" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="group-title">
        <h3 style="margin: 0;" class="group-title">
        <span class="group-icon">🔋</span> Quản lý Pin (Battery Monitor)
      </h3>
      </div>
      <div class="tab-header-actions">
        <span class="tab-status-pill saved" data-tab-status="panel-power">Đã lưu</span>
        <button type="button" class="btn btn-primary btn-save-tab" data-tab="panel-power" title="Lưu thông tin mục này">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span>Lưu mục này</span>
        </button>
      </div>
    </div>
      <label class="toggle-container">
        <input type="checkbox" id="battery_enable" data-config-key="power.battery_enable">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Bật Theo dõi Pin</span>
      </label>
    </div>
    
    <div id="grp_battery_adc" style="display: none; margin-top: 15px;">
      <div class="form-row">
        <div class="form-col" style="flex:1;">
          <label class="toggle-container">
            <input type="checkbox" data-config-key="power.battery_adc">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Đo Pin bằng ADC qua cầu phân áp</span>
          </label>
        </div>
      </div>
      
      <div class="pin-grid">
        <div class="pin-field">
          <label>ADC Channel</label>
          <input type="number" data-config-key="power.battery_ch" placeholder="0">
          <div class="field-hint" style="font-size:10px;">Ví dụ: Kênh 0 của ADC1.</div>
        </div>
        <div class="pin-field">
          <label>Điện trở R1 (kΩ)</label>
          <input type="number" data-config-key="power.battery_r1" placeholder="100">
        </div>
        <div class="pin-field">
          <label>Điện trở R2 (kΩ)</label>
          <input type="number" data-config-key="power.battery_r2" placeholder="100">
        </div>
      </div>
    </div>
  </div>

  <div class="config-group">
    <div class="group-header">
      <h3 class="group-title">
        <span class="group-icon">⚡</span> Cảm biến Dòng điện (Power Sensor)
      </h3>
      <label class="toggle-container">
        <input type="checkbox" id="ina_enable" data-config-key="power.ina2xx">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Bật INA219/INA226</span>
      </label>
    </div>
    
    <div id="grp_ina_config" style="display: none; margin-top: 15px;">
      <div class="form-row">
        <div class="form-col" style="flex:1;">
          <label class="toggle-container">
            <input type="checkbox" data-config-key="power.ina219">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Dùng chip INA219 (Tắt = INA226)</span>
          </label>
        </div>
      </div>
      
      <div class="pin-grid">
        <div class="pin-field">
          <label>I2C SDA</label>
          <input type="number" data-config-key="power.ina_sda" placeholder="11">
        </div>
        <div class="pin-field">
          <label>I2C SCL</label>
          <input type="number" data-config-key="power.ina_scl" placeholder="12">
        </div>
      </div>
    </div>
  </div>

  <div class="config-group">
    <div class="group-header">
      <h3 class="group-title">
        <span class="group-icon">🔌</span> Mạch sạc (Charge Detect)
      </h3>
      <label class="toggle-container">
        <input type="checkbox" id="tp4056_enable" data-config-key="power.tp4056">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Báo sạc qua chân CHRG (TP4056)</span>
      </label>
    </div>
    
    <div id="grp_tp4056" style="display: none; margin-top: 15px;">
      <div class="form-row">
        <div class="form-col" style="flex:1;">
          <label>
            Chân nhận diện đang sạc (CHRG GPIO)
            <button class="info-btn" data-info-title="Chân CHRG" data-info-desc="Kết nối chân báo sạc của mạch TP4056/IP5306 vào ESP32. Khi đang cắm sạc chân này sẽ kéo xuống GND, màn hình sẽ hiện biểu tượng sạc pin.">-ℹ️-</button>
          </label>
          <input type="number" data-config-key="power.tp4056_gpio" placeholder="GPIO">
        </div>
      </div>
    </div>
  </div>

  
  <dialog id="power-info-dialog" class="sys-dialog">
    <div class="dialog-content">
      <h3 id="power-dialog-title">ℹ️ Thông tin</h3>
      <p id="power-dialog-desc">Mô tả chi tiết</p>
      <button id="power-dialog-close" class="btn btn-outline" style="width: 100px;">Đã hiểu</button>
    </div>
  </dialog>

  <script>
    // Logic hiển thị block con
    document.getElementById('battery_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_battery_adc').style.display = e.target.checked ? 'block' : 'none';
    });
    
    document.getElementById('ina_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_ina_config').style.display = e.target.checked ? 'block' : 'none';
    });
    
    document.getElementById('tp4056_enable')?.addEventListener('change', (e) => {
      document.getElementById('grp_tp4056').style.display = e.target.checked ? 'block' : 'none';
    });

    setTimeout(() => {
      document.getElementById('battery_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('ina_enable')?.dispatchEvent(new Event('change'));
      document.getElementById('tp4056_enable')?.dispatchEvent(new Event('change'));
    }, 100);

    // Popup Logic cho Power
    const pwrDialog = document.getElementById('power-info-dialog');
    const pwrDialogTitle = document.getElementById('power-dialog-title');
    const pwrDialogDesc = document.getElementById('power-dialog-desc');
    const pwrCloseBtn = document.getElementById('power-dialog-close');
    
    if(pwrDialog && pwrCloseBtn) {
      pwrCloseBtn.addEventListener('click', () => pwrDialog.close());
      pwrDialog.addEventListener('click', (e) => {
        const rect = pwrDialog.getBoundingClientRect();
        if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
          pwrDialog.close();
        }
      });
    }

    document.querySelectorAll('#panel-power .info-btn').forEach(btn => {
      btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      `;
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        pwrDialogTitle.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          ${btn.getAttribute('data-info-title')}
        `;
        pwrDialogDesc.innerText = btn.getAttribute('data-info-desc');
        pwrDialog.showModal();
      });
    });
  </script>
</section>
