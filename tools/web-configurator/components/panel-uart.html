<section class="tab-panel" id="panel-uart">
        <div class="config-group">
          <div class="group-header">
            <div class="group-title">
              <h2>📡 Cổng UART Mở rộng</h2>
              <span class="group-desc">Giao tiếp với Arduino, Raspberry Pi, cảm biến UART hoặc module 4G</span>
            </div>
            <div class="tab-header-actions">
              <span class="tab-status-pill saved" data-tab-status="panel-uart">Đã lưu</span>
              <button type="button" class="btn btn-primary btn-save-tab" data-tab="panel-uart">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                <span>Lưu mục này</span>
              </button>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-item span-2">
              <label class="form-checkbox"><input type="checkbox" id="uart_enable"><span>Bật cổng UART mở rộng</span></label>
            </div>
            <div class="form-item uart-fields" style="display:none">
              <label class="form-label" for="uart_port">Cổng phần cứng UART</label>
              <select class="form-control" id="uart_port">
                <option value="CUSTOM_UART_PORT_1" selected>UART 1</option>
                <option value="CUSTOM_UART_PORT_2">UART 2</option>
              </select>
            </div>
            <div class="form-item uart-fields" style="display:none">
              <label class="form-label" for="uart_baud">Tốc độ Baudrate</label>
              <select class="form-control" id="uart_baud">
                <option value="9600">9600</option>
                <option value="19200">19200</option>
                <option value="38400">38400</option>
                <option value="57600">57600</option>
                <option value="115200" selected>115200 (Mặc định)</option>
                <option value="230400">230400</option>
                <option value="460800">460800</option>
                <option value="921600">921600</option>
              </select>
            </div>
            <div class="form-item uart-fields" style="display:none">
              <label class="form-label" for="uart_tx">TX GPIO</label>
              <input type="number" class="form-control" id="uart_tx" min="-1" max="48" value="-1">
            </div>
            <div class="form-item uart-fields" style="display:none">
              <label class="form-label" for="uart_rx">RX GPIO</label>
              <input type="number" class="form-control" id="uart_rx" min="-1" max="48" value="-1">
            </div>
            <div class="form-item span-2 uart-fields" style="display:none">
              <label class="form-checkbox"><input type="checkbox" id="uart_flow"><span>Bật điều khiển luồng phần cứng (RTS / CTS)</span></label>
            </div>
            <div class="form-item uart-fields uart-flow-fields" style="display:none">
              <label class="form-label" for="uart_rts">RTS GPIO</label>
              <input type="number" class="form-control" id="uart_rts" min="-1" max="48" value="-1">
            </div>
            <div class="form-item uart-fields uart-flow-fields" style="display:none">
              <label class="form-label" for="uart_cts">CTS GPIO</label>
              <input type="number" class="form-control" id="uart_cts" min="-1" max="48" value="-1">
            </div>
          </div>
        </div>
      </section>
